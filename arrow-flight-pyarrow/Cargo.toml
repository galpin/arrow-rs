[package]
name = "arrow-flight-pyarrow"
description = "Minimal PyO3 bindings for writing an Apache Arrow Flight server in Python"
version = "0.1.0"
homepage = "https://github.com/apache/arrow-rs"
repository = "https://github.com/apache/arrow-rs"
authors = ["Apache Arrow <dev@arrow.apache.org>"]
license = "Apache-2.0"
keywords = ["arrow", "flight", "pyarrow"]
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "arrow_flight_pyarrow"
crate-type = ["cdylib"]

[dependencies]
arrow-array = { path = "../arrow-array" }
arrow-flight = { path = "../arrow-flight" }
arrow-pyarrow = { path = "../arrow-pyarrow" }
arrow-schema = { path = "../arrow-schema" }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
pyo3 = { version = "0.28.0", features = ["extension-module"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", default-features = false }
tonic = { version = "0.14.1", default-features = false, features = ["transport", "codegen", "router"] }
